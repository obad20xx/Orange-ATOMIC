services:
  postgres:
    image: 'postgres:latest'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atomic_db}
      POSTGRES_USER: ${POSTGRES_USER:-atomic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  vault:
    image: hashicorp/vault:1.17
    container_name: atomic-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-only-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command: vault server -dev
    ports:
      - "8200:8200"
    volumes:
      - vault-file:/vault/file

volumes:
  postgres-data:
  vault-file:
