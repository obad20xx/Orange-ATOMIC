apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.global.releaseName }}-backend
  labels:
    app: {{ .Values.global.releaseName }}-backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ .Values.global.releaseName }}-backend