apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasky-ingress
  annotations:
    # Tell the cluster to use the Traefik ingress engine built into k3d
    kubernetes.io/ingress.class: traefik
    # Enable Nginx-style path rewriting so our backend doesn't break on prefix matching
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api-prefix@cuberdon
spec:
  rules:
    - http:
        paths:
          # 1. Route backend endpoints directly to Spring Boot
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tasky-backend
                port:
                  number: 8080
          - path: /infos
            pathType: Prefix
            backend:
              service:
                name: tasky-backend
                port:
                  number: 8080
          
          # 2. Route all fallback frontend traffic to Vue 3 / Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasky-frontend
                port:
                  number: 8
