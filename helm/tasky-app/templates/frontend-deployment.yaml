apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasky.releaseName" . }}-frontend
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
    {{- include "tasky.frontend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "tasky.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasky.labels" . | nindent 8 }}
        {{- include "tasky.frontend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      # FIX 5: Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 101        # nginx default non-root user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # FIX 2: required guard — fails fast at helm install if image not set
          image: "{{ required "frontend.image.repository is required — set via --set frontend.image.repository" .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          # FIX 5: Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
              name: http
          # FIX 4: Health probes added — nginx returns 200 on / when healthy
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.frontend.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.frontend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.frontend.readinessProbe.successThreshold }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # FIX 5: emptyDir mounts required for readOnlyRootFilesystem: true
            # nginx writes pid and cache files to these paths at runtime
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "tasky.releaseName" . }}-nginx-config
        # FIX 5: writable temp volumes for nginx (required with readOnlyRootFilesystem)
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
