{{/* FIX 2: required guard — fails fast at helm template/install if backendServiceName not set */}}
{{- $backendSvc := required "frontend.backendServiceName is required — set via --set frontend.backendServiceName (e.g. orange-atomic-backend)" .Values.frontend.backendServiceName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tasky.releaseName" . }}-nginx-config
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.containerPort }};
        server_name _;

        # Serve static frontend files
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API calls to backend
        location /api/ {
            proxy_pass http://{{ $backendSvc }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /infos (Vault health info endpoint)
        location /infos {
            proxy_pass http://{{ $backendSvc }}:{{ .Values.backend.service.port }}/infos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Swagger UI
        location /swagger-ui {
            proxy_pass http://{{ $backendSvc }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FIX 10: Added missing X-Real-IP, X-Forwarded-For, X-Forwarded-Proto headers
        # (was inconsistent — all other blocks had them, this one didn't)
        location /v3/api-docs {
            proxy_pass http://{{ $backendSvc }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy Actuator health (used by K8s probes via LB)
        location /actuator/health {
            proxy_pass http://{{ $backendSvc }}:{{ .Values.backend.service.port }}/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vue SPA fallback — serves index.html for all unmatched routes
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
