apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.releaseName }}-nginx-config
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.containerPort }};
        server_name _;

        # Serve static frontend files
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API calls to the backend service
        location /api/ {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy actuator/info endpoints to backend
        location /infos {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }}/infos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle Vue SPA routing - redirect all non-file requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }