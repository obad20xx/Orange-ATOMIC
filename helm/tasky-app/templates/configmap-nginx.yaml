apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.releaseName }}-nginx-config
data:
  default.conf: |
    server {
        listen {{ .Values.frontend.containerPort }};
        server_name _;

        # Serve static frontend files
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API calls
        location /api/ {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy /infos
        location /infos {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }}/infos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🚀 CLEAN MATCH: Matches /swagger-ui, /swagger-ui/, and /swagger-ui/index.html
        location /swagger-ui {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 🚀 CLEAN MATCH: Matches /v3/api-docs and everything under it
        location /v3/api-docs {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }};
            proxy_set_header Host $host;
        }

        # 🚀 CLEAN MATCH: Matches only the explicit health check path
        location /actuator/health {
            proxy_pass http://{{ .Values.frontend.backendServiceName }}:{{ .Values.backend.service.port }}/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle Vue SPA routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
