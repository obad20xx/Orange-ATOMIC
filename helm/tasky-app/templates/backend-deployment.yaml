apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tasky.releaseName" . }}-backend
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
    {{- include "tasky.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "tasky.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasky.labels" . | nindent 8 }}
        {{- include "tasky.backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      # FIX 5: Pod-level security context with seccomp
      securityContext:
        runAsNonRoot: {{ .Values.backend.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.backend.database.host }}
      initContainers:
        - name: init-vault-secrets
          image: curlimages/curl:8.6.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Vault to be ready..."
              until curl --silent --fail "$VAULT_URI/v1/sys/health" > /dev/null; do
                sleep 2
              done
              echo "Vault is reachable. Writing database credentials..."
              curl --silent --fail \
                --header "X-Vault-Token: $VAULT_TOKEN" \
                --request POST \
                --data "{\"data\": {\"spring.datasource.username\": \"$DB_USER\", \"spring.datasource.password\": \"$DB_PASSWORD\"}}" \
                "$VAULT_URI/v1/secret/data/atomic-backend"
              echo "Vault secrets successfully initialized!"
          env:
            - name: VAULT_URI
              value: "{{ .Values.backend.vault.scheme }}://{{ .Values.backend.vault.host }}:{{ .Values.backend.vault.port }}"
            {{- if .Values.backend.vault.tokenSecret.name }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.vault.tokenSecret.name }}
                  key: {{ .Values.backend.vault.tokenSecret.key }}
            {{- else if .Values.backend.vault.devRootToken }}
            - name: VAULT_TOKEN
              value: {{ .Values.backend.vault.devRootToken | quote }}
            {{- end }}
            - name: DB_USER
              value: {{ .Values.backend.database.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.database.passwordSecret.name }}
                  key: {{ .Values.backend.database.passwordSecret.key }}

        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z "$DB_HOST" "$DB_PORT"; do
                echo "Waiting for PostgreSQL at $DB_HOST:$DB_PORT..."
                sleep 3
              done
              echo "PostgreSQL is ready!"
          env:
            - name: DB_HOST
              value: {{ .Values.backend.database.host }}
            - name: DB_PORT
              value: "{{ .Values.backend.database.port }}"
      {{- end }}
      containers:
        - name: backend
          # FIX 2: required guard — fails fast at helm install if image not set
          image: "{{ required "backend.image.repository is required — set via --set backend.image.repository" .Values.backend.image.repository }}:{{ required "backend.image.tag is required — set via --set backend.image.tag" .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          # FIX 5: Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Note: readOnlyRootFilesystem is intentionally omitted for backend
            # because the JVM writes to /tmp. Mount an emptyDir at /tmp if you
            # need to enable it.
          ports:
            - containerPort: {{ .Values.backend.service.port }}
              name: http
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.healthEndpoint }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          # FIX 9: readinessProbe now includes failureThreshold and successThreshold
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.healthEndpoint }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.backend.readinessProbe.successThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          env:
            # FIX 3: SPRING_DATASOURCE_URL is now gated on database.host
            # Previously it always rendered even with empty host → "jdbc:postgresql://:5432/"
            {{- if .Values.backend.database.host }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.backend.database.host }}:{{ .Values.backend.database.port }}/{{ .Values.backend.database.name }}"
            {{- end }}
            - name: VAULT_ENABLED
              value: "true"
            {{- if .Values.backend.vault.tokenSecret.name }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.vault.tokenSecret.name }}
                  key: {{ .Values.backend.vault.tokenSecret.key }}
            {{- else if .Values.backend.vault.devRootToken }}
            - name: VAULT_TOKEN
              value: {{ .Values.backend.vault.devRootToken | quote }}
            {{- end }}
            - name: VAULT_URI
              value: "{{ .Values.backend.vault.scheme }}://{{ .Values.backend.vault.host }}:{{ .Values.backend.vault.port }}"
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.backend.corsAllowedOrigins | quote }}
            {{- if .Values.backend.extraEnv }}
            {{- toYaml .Values.backend.extraEnv | nindent 12 }}
            {{- end }}
