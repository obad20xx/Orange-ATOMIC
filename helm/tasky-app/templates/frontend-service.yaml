apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasky.releaseName" . }}-frontend
  labels:
    {{- include "tasky.labels" . | nindent 4 }}
    {{- include "tasky.frontend.selectorLabels" . | nindent 4 }}
  # FIX 6: Annotations are now value-driven — not hardcoded DigitalOcean strings.
  # Default values still target DO, but can be overridden for AWS/GKE:
  #   --set frontend.service.annotations={}               (disable all)
  #   --set frontend.service.annotations."key"="value"    (custom annotation)
  {{- with .Values.frontend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "tasky.frontend.selectorLabels" . | nindent 4 }}
