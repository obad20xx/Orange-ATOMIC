# ============================================================================
# ORANGE-ATOMIC — Production Helm Values
# All values can be overridden at deploy-time via `--set` or `--set-file`
# ============================================================================

global:
  # Release name - becomes the prefix for all Kubernetes resources
  releaseName: "orange-atomic"

  # Name of the imagePullSecret for private Docker registries
  # Leave empty (null / "") if images are public
  imagePullSecret: ""

# ============================================================================
# BACKEND — Spring Boot application
# ============================================================================
backend:
  replicaCount: 1

  # FIX 1: Corrected image structure — was double-nested backend.image.image.*
  # Set backend.image.repository and backend.image.tag at deploy time via --set
  image:
    repository: ""        # e.g. registry.gitlab.com/your-group/atomic-backend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001

  healthEndpoint: /actuator/health

  livenessProbe:
    initialDelaySeconds: 65
    periodSeconds: 10
    failureThreshold: 3

  # FIX 9: Added missing failureThreshold and successThreshold
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # Database connection parameters
  database:
    host: ""           # e.g. orange-atomic-postgresql (Bitnami convention)
    port: 5432
    name: ""           # database name (from CI variable or --set)
    username: ""       # database user (from CI variable or --set)
    passwordSecret:
      name: ""         # Kubernetes Secret name containing the password
      key: "password"  # Key within that Secret

  # Vault connection parameters
  vault:
    scheme: "http"
    host: ""           # e.g. orange-atomic-vault (Bitnami convention)
    port: 8200
    # Fallback dev token for local/dev environments (tokenSecret takes precedence)
    devRootToken: ""
    tokenSecret:
      name: ""         # Kubernetes Secret name containing the vault token
      key: "token"     # Key within that Secret

  # Comma-separated list of allowed CORS origins
  # Use "*" for development, specific URL for production
  corsAllowedOrigins: "*"

  # Additional environment variables injected verbatim into the container
  # Useful for feature flags, external service URLs, etc.
  extraEnv: []
  # - name: MY_FEATURE_FLAG
  #   value: "true"
  # - name: EXTERNAL_SERVICE_URL
  #   value: "https://api.example.com"

# ============================================================================
# FRONTEND — Vue3 / Nginx application
# ============================================================================
frontend:
  replicaCount: 1

  image:
    repository: ""       # e.g. registry.gitlab.com/your-project/frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  # Nginx listens on this container port
  containerPort: 80

  service:
    type: LoadBalancer
    port: 80
    # FIX 6: DO annotations moved to values for cloud portability
    # Override with {} to disable, or replace keys for AWS/GKE
    annotations:
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-protocol: "http"
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-path: "/"
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "10"
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-unhealthy-threshold: "3"
      service.beta.kubernetes.io/do-loadbalancer-healthcheck-healthy-threshold: "2"

  # The internal Kubernetes service name of the backend
  # (the Nginx proxy_pass target)
  backendServiceName: ""  # e.g. orange-atomic-backend

  # FIX 4: Frontend health probe values
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# ============================================================================
# SUB-CHART TOGGLES — FIX 8: condition flags for postgresql and vault
# Set to false to skip deploying the sub-chart (e.g. using an external DB)
# ============================================================================
postgresql:
  enabled: true

vault:
  enabled: true
