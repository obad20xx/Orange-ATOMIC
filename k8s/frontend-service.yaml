##############################################################################
# frontend-service.yaml
# Exposes the Frontend Deployment as a ClusterIP Service on port 80.
# The Nginx Ingress Controller routes public traffic to this service (REQ-8.5).
# Using ClusterIP (not LoadBalancer) because the external load balancer is
# managed by the Nginx Ingress Controller, eliminating DigitalOcean LB
# annotations entirely (REQ-14.7).
##############################################################################
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: production
  labels:
    app: frontend
    managed-by: azure-pipelines
spec:
  type: ClusterIP
  # Selector labels exactly match the pod template labels in frontend-deployment.yaml (REQ-8.5)
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
