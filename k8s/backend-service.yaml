##############################################################################
# backend-service.yaml
# Exposes the Backend Deployment as a ClusterIP Service on port 8080.
# ClusterIP ensures the Backend is not directly reachable from outside
# the cluster — only the Frontend Nginx proxy can reach it (REQ-7.6).
##############################################################################
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: production
  labels:
    app: backend
    managed-by: azure-pipelines
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
