##############################################################################
# frontend-configmap.yaml
# Supplies the Nginx default.conf to the Frontend pod via a ConfigMap volume.
#
# Nginx reverse-proxy routing (preserved from existing Helm configmap-nginx.yaml):
#   /api/            → backend-service:8080/api/
#   /infos           → backend-service:8080/infos
#   /swagger-ui      → backend-service:8080/swagger-ui
#   /v3/api-docs     → backend-service:8080/v3/api-docs
#   /actuator/health → backend-service:8080/actuator/health
#   /                → Vue SPA static files with index.html fallback
#
# All proxy location blocks include the four standard forwarding headers
# (REQ-8.3). The root location includes try_files for Vue Router (REQ-8.4).
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: production
  labels:
    app: frontend
    managed-by: azure-pipelines
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        # Serve static Vue 3 frontend files
        root /usr/share/nginx/html;
        index index.html;

        # ---------------------------------------------------------------------------
        # Reverse-proxy: /api/ → Backend Spring Boot REST API
        # Eliminates CORS by routing API calls through the same origin.
        # ---------------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend-service:8080;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # ---------------------------------------------------------------------------
        # Reverse-proxy: /infos → Backend info endpoint
        # ---------------------------------------------------------------------------
        location /infos {
            proxy_pass http://backend-service:8080/infos;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # ---------------------------------------------------------------------------
        # Reverse-proxy: /swagger-ui → Springdoc OpenAPI Swagger UI
        # ---------------------------------------------------------------------------
        location /swagger-ui {
            proxy_pass http://backend-service:8080;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # ---------------------------------------------------------------------------
        # Reverse-proxy: /v3/api-docs → OpenAPI 3 specification endpoint
        # ---------------------------------------------------------------------------
        location /v3/api-docs {
            proxy_pass http://backend-service:8080;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # ---------------------------------------------------------------------------
        # Reverse-proxy: /actuator/health → Spring Boot Actuator health endpoint
        # Used by the Nginx Ingress health check path.
        # ---------------------------------------------------------------------------
        location /actuator/health {
            proxy_pass http://backend-service:8080/actuator/health;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # ---------------------------------------------------------------------------
        # Vue SPA fallback — serves index.html for all unmatched client-side routes.
        # Required for Vue Router history-mode navigation (REQ-8.4).
        # ---------------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
