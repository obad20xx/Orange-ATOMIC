##############################################################################
# backend-serviceaccount.yaml
# Kubernetes ServiceAccount for the Backend pod with Azure Workload Identity
# annotations. The azure.workload.identity/client-id annotation binds this
# ServiceAccount to the AKS Managed Identity via a Federated Identity
# Credential, allowing the Backend pod to authenticate to Key Vault using
# the Azure SDK without any stored credentials (REQ-7.5, REQ-6.3).
#
# NOTE: The AZURE_CLIENT_ID placeholder is substituted by the pipeline
# using the AKS system-assigned Managed Identity client ID from Terraform output.
##############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-workload-identity-sa
  namespace: production
  annotations:
    # Client ID of the AKS system-assigned Managed Identity.
    # Substituted by the pipeline: $(AKS_MANAGED_IDENTITY_CLIENT_ID)
    azure.workload.identity/client-id: "${AZURE_CLIENT_ID}"
  labels:
    app: backend
    managed-by: azure-pipelines
