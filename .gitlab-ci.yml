stages:
  - build-backend
  - build-frontend
  - deploy

variables:
  # GitLab Container Registry (auto-provided by GitLab)
  REGISTRY: $CI_REGISTRY
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

default:
  image: alpine:3.19

# ==========================================
# STAGE 1: Build Backend Docker Image
# ==========================================
build-backend:
  stage: build-backend
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY"
  script:
    - docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" ./ATOMIC-Backend
    - docker push "$BACKEND_IMAGE:$IMAGE_TAG"
    - docker push "$BACKEND_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ==========================================
# STAGE 2: Build Frontend Docker Image
# ==========================================
build-frontend:
  stage: build-frontend
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "Logging into GitLab Container Registry..."
    - echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USER" --password-stdin "$REGISTRY"
  script:
    - docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" -t "$FRONTEND_IMAGE:latest" ./ATOMIC-Frontend
    - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
    - docker push "$FRONTEND_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ==========================================
# STAGE 3: Deploy to DigitalOcean Kubernetes
# ==========================================
deploy-to-do-k8s:
  stage: deploy
  image: alpine:3.19
  needs:
    - build-backend
    - build-frontend
  before_script:
    - |
      apk add --no-cache curl openssl ca-certificates gettext bash

      KUBECTL_VERSION="${KUBECTL_VERSION:-v1.28.0}"
      curl -LO "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
      chmod +x kubectl && mv kubectl /usr/local/bin/

      HELM_VERSION="${HELM_VERSION:-3.14.0}"
      curl -LO "https://get.helm.sh/helm-v$HELM_VERSION-linux-amd64.tar.gz"
      tar -xzf "helm-v$HELM_VERSION-linux-amd64.tar.gz"
      mv linux-amd64/helm /usr/local/bin/helm
      rm -rf linux-amd64 "helm-v$HELM_VERSION-linux-amd64.tar.gz"

      mkdir -p ~/.kube
      echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
      chmod 600 ~/.kube/config

      # Apply defaults for optional variables (shell-level, not YAML-level)
      HELM_RELEASE_NAME="${HELM_RELEASE_NAME:-orange-atomic}"
      HELM_NAMESPACE="${HELM_NAMESPACE:-production}"
      IMAGE_PULL_SECRET="${IMAGE_PULL_SECRET:-gitlab-registry}"
      DB_HOST="${DB_HOST:-${HELM_RELEASE_NAME}-postgresql}"
      DB_PORT="${DB_PORT:-5432}"
      DB_NAME="${DB_NAME:-atomic_db}"
      DB_USER="${DB_USER:-atomic_user}"
      DB_PASSWORD_SECRET="${DB_PASSWORD_SECRET:-${HELM_RELEASE_NAME}-postgresql}"
      DB_PASSWORD_SECRET_KEY="${DB_PASSWORD_SECRET_KEY:-password}"
      VAULT_SCHEME="${VAULT_SCHEME:-http}"
      VAULT_HOST="${VAULT_HOST:-${HELM_RELEASE_NAME}-vault}"
      VAULT_PORT="${VAULT_PORT:-8200}"
      VAULT_DEV_ROOT_TOKEN="${VAULT_DEV_ROOT_TOKEN:-dev-only-root-token}"
      VAULT_TOKEN_SECRET="${VAULT_TOKEN_SECRET:-${HELM_RELEASE_NAME}-vault-token}"
      VAULT_TOKEN_SECRET_KEY="${VAULT_TOKEN_SECRET_KEY:-token}"
      CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-*}"
      BACKEND_SERVICE_NAME="${BACKEND_SERVICE_NAME:-${HELM_RELEASE_NAME}-backend}"
      HELM_TIMEOUT="${HELM_TIMEOUT:-10m}"
  script: |
    echo "=== Step 1: Verify cluster connectivity ==="
    kubectl cluster-info
    kubectl get nodes

    echo "=== Step 2: Update Helm chart dependencies ==="
    helm dependency update helm/tasky-app

    echo "=== Step 3: Ensure target namespace exists ==="
    kubectl create namespace "$HELM_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

    echo "=== Step 4: Create image pull secret for GitLab Registry ==="
    kubectl create secret docker-registry "$IMAGE_PULL_SECRET" --docker-server="$REGISTRY" --docker-username="$REGISTRY_USER" --docker-password="$REGISTRY_PASSWORD" --namespace="$HELM_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

    echo "=== Step 5: Deploy / Upgrade via Helm ==="
    helm upgrade --install "$HELM_RELEASE_NAME" helm/tasky-app \
      --namespace="$HELM_NAMESPACE" \
      --create-namespace \
      --set global.releaseName="$HELM_RELEASE_NAME" \
      --set global.imagePullSecret="$IMAGE_PULL_SECRET" \
      --set backend.image.repository="$BACKEND_IMAGE" \
      --set backend.image.tag="$IMAGE_TAG" \
      --set backend.image.pullPolicy="Always" \
      --set backend.database.host="$DB_HOST" \
      --set backend.database.port="$DB_PORT" \
      --set backend.database.name="$DB_NAME" \
      --set backend.database.username="$DB_USER" \
      --set backend.database.passwordSecret.name="$DB_PASSWORD_SECRET" \
      --set backend.database.passwordSecret.key="$DB_PASSWORD_SECRET_KEY" \
      --set postgresql.auth.database="$DB_NAME" \
      --set postgresql.auth.username="$DB_USER" \
      --set postgresql.auth.password="$POSTGRES_PASSWORD" \
      --set vault.server.dev.devRootToken="$VAULT_DEV_ROOT_TOKEN" \
      --set backend.vault.scheme="$VAULT_SCHEME" \
      --set backend.vault.host="$VAULT_HOST" \
      --set backend.vault.port="$VAULT_PORT" \
      --set backend.vault.tokenSecret.name="$VAULT_TOKEN_SECRET" \
      --set backend.vault.tokenSecret.key="$VAULT_TOKEN_SECRET_KEY" \
      --set backend.corsAllowedOrigins="$CORS_ALLOWED_ORIGINS" \
      --set frontend.image.repository="$FRONTEND_IMAGE" \
      --set frontend.image.tag="$IMAGE_TAG" \
      --set frontend.image.pullPolicy="Always" \
      --set frontend.backendServiceName="$BACKEND_SERVICE_NAME" \
      --wait \
      --timeout "$HELM_TIMEOUT"

    echo "=== Step 6: Verify rollout status ==="
    kubectl rollout status deployment/"$HELM_RELEASE_NAME"-backend --namespace="$HELM_NAMESPACE" --timeout=5m
    kubectl rollout status deployment/"$HELM_RELEASE_NAME"-frontend --namespace="$HELM_NAMESPACE" --timeout=5m

    echo "=== Step 7: Wait for DigitalOcean Load Balancer IP ==="
    kubectl wait --for=jsonpath='{.status.loadBalancer.ingress[0].ip}' service/"$HELM_RELEASE_NAME"-frontend --namespace="$HELM_NAMESPACE" --timeout=6m 2>/dev/null
    EXTERNAL_IP=$(kubectl get svc "$HELM_RELEASE_NAME"-frontend -n "$HELM_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
    test -n "$EXTERNAL_IP" && echo "==========================================================" && echo "SUCCESS! Orange-ATOMIC is live at: http://$EXTERNAL_IP" && echo "Backend API at: http://$EXTERNAL_IP/api" && echo "=========================================================="

    kubectl get pods,svc -n "$HELM_NAMESPACE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH