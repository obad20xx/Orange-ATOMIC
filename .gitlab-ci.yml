stages:
  - cluster-check
  - test-deploy

default:
  image: bitnami/kubectl:1.28-debian-11 

before_script:
  - echo "Decoding DigitalOcean kubeconfig credentials..."
  - mkdir -p ~/.kube
  - echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
  - chmod 600 ~/.kube/config

# ==========================================
# STAGE 1: Verify Cluster Communication
# ==========================================
verify-cluster-connection:
  stage: cluster-check
  image:
    name: bitnami/kubectl:1.28-debian-11
    entrypoint: [""] 
  script:
    - echo "Testing basic authentication to DigitalOcean API..."
    - kubectl cluster-info
    - echo "Listing current active worker nodes in the cluster:"
    - kubectl get nodes

# ==========================================
# STAGE 2: Test Deployment using Raw Manifests
# ==========================================
deploy-test-nginx:
  stage: test-deploy
  image:
    name: bitnami/kubectl:1.28-debian-11
    entrypoint: [""]
  script:
    - echo "Creating a temporary testing namespace..."
    - kubectl create namespace pipeline-test-zone --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "Deploying a public Nginx web server container from Docker Hub..."
    - kubectl create deployment public-nginx-test --image=nginx:alpine --namespace=pipeline-test-zone --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "Exposing the deployment internally to verify service mapping..."
    - kubectl create service clusterip public-nginx-test --tcp=80:80 --namespace=pipeline-test-zone --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "Checking deployment rollout status..."
    - kubectl rollout status deployment/public-nginx-test --namespace=pipeline-test-zone --timeout=1m
    
    - echo "Deployment status successfully verified!"
    - kubectl get pods,svc -n pipeline-test-zone
  rules:
    - if: $CI_COMMIT_BRANCH == "master"