stages:
  - cluster-check
  - test-deploy

default:
  image: alpine:3.19

before_script:
  - echo "Installing standard dependencies (curl & openssl)..."
  - apk add --no-cache curl openssl
  
  - echo "Downloading official stable kubectl binary..."
  - curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
  - chmod +x ./kubectl
  - mv ./kubectl /usr/local/bin/kubectl
  
  - echo "Decoding DigitalOcean kubeconfig credentials..."
  - mkdir -p ~/.kube
  - echo "$KUBECONFIG_BASE64" | base64 -d > ~/.kube/config
  - chmod 600 ~/.kube/config

# ==========================================
# STAGE 1: Verify Cluster Communication
# ==========================================
verify-cluster-connection:
  stage: cluster-check
  script:
    - echo "Testing basic authentication to DigitalOcean API..."
    - kubectl cluster-info
    - echo "Listing current active worker nodes in the cluster:"
    - kubectl get nodes

# ==========================================
# STAGE 2: Test Deployment & Public Exposure
# ==========================================
deploy-test-nginx:
  stage: test-deploy
  script:
    - echo "Creating a temporary testing namespace..."
    - kubectl create namespace pipeline-test-zone --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "Deploying a public Nginx web server container from Docker Hub..."
    - kubectl create deployment public-nginx-test --image=nginx:alpine --namespace=pipeline-test-zone --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "Exposing the deployment via a DigitalOcean Cloud Load Balancer..."
    # Changed from 'clusterip' to 'loadbalancer' to trigger public infrastructure creation
    - kubectl create service loadbalancer public-nginx-test --tcp=80:80 --namespace=pipeline-test-zone --dry-run=client -o yaml | kubectl apply -f -
    
    - echo "Checking deployment rollout status..."
    - kubectl rollout status deployment/public-nginx-test --namespace=pipeline-test-zone --timeout=1m
    
    - echo "Waiting for DigitalOcean to allocate your public IP address..."
    # This loop polls the service for up to 2 minutes until DigitalOcean finishes provisioning the IP
    - |
      for i in $(seq 1 24); do
        EXTERNAL_IP=$(kubectl get svc public-nginx-test -n pipeline-test-zone -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        if [ -n "$EXTERNAL_IP" ]; then
          echo "========================================================="
          echo "SUCCESS! Your Nginx test app is live at: http://$EXTERNAL_IP"
          echo "========================================================="
          break
        fi
        echo "Still waiting for DigitalOcean IP allocation (Checking again in 5s)..."
        sleep 5
      done

    - kubectl get pods,svc -n pipeline-test-zone
  rules:
    - if: $CI_COMMIT_BRANCH == "master"