##############################################################################
# azure-pipelines.yml
# ATOMIC Tasky — Production-Grade CI/CD Pipeline
#
# Features:
#   1. Dynamic Triggering (runs validation/plan on PRs, deploys on azure pushes)
#   2. Code Quality & Formatting checks (terraform fmt -check)
#   3. Configuration & Security Auditing (Trivy manifest/Terraform scanning)
#   4. Parallel Java/Node unit testing and publishing of results
#   5. Docker builds with pre-push Trivy image vulnerability scans
#   6. Artifact publication to prevent code drifts during deployments
#   7. Infrastructure CD stage separation (Plan vs Apply)
#   8. Gated Environment Deployments (production Environment + Approvals)
#   9. Dynamic Workload Identity configuration (via outputted client ID)
#  10. Automated Rollback on deployment failure
#
# Authentication:
#   All Azure operations use the 'AzureServiceConnection' Azure DevOps Service
#   Connection (Service Principal). No credentials are hardcoded.
#
# Required Azure DevOps variable group: 'atomic-tasky-vars' containing:
#   TF_BACKEND_RESOURCE_GROUP    — ERAMOVA
#   TF_BACKEND_STORAGE_ACCOUNT  — atomicterraformstate
#   TF_BACKEND_CONTAINER        — tfstate
#   TF_BACKEND_KEY              — atomic-tasky.tfstate
#   AZURE_SUBSCRIPTION_ID       — 283fd97c-a3da-4e72-9b52-586347ed963a
#   AZURE_TENANT_ID             — 04847097-e4d0-48d9-8bad-cdbc2bbc3698
##############################################################################

trigger:
  branches:
    include:
      - Azure

pr:
  branches:
    include:
      - Azure

variables:
  - group: atomic-tasky-vars
  - name: SERVICE_CONNECTION
    value: 'AzureServiceConnection'
  - name: TERRAFORM_DIR
    value: '$(Build.SourcesDirectory)/terraform'
  - name: K8S_DIR
    value: '$(Build.SourcesDirectory)/k8s'
  - name: INGRESS_NAMESPACE
    value: 'ingress-nginx'
  - name: APP_NAMESPACE
    value: 'production'

stages:
  # =========================================================================
  # STAGE 1: Validate & Audit (PRs and azure)
  # Runs tests, checks style, and audits code/configurations for issues.
  # =========================================================================
  - stage: Validate
    displayName: '🧪 Stage 1 — Validate, Lint & Audit'
    jobs:
      # ---------------------------------------------------------------------
      # Job: lint_and_security_scan (Trivy audits + Terraform checks)
      # ---------------------------------------------------------------------
      - job: lint_and_security_scan
        displayName: 'Security Auditing & Format Checks'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - script: |
              set -euo pipefail
              mkdir -p $(Agent.TempDirectory)/bin
              curl -L -s -S -o terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
              unzip -o -q terraform.zip -d $(Agent.TempDirectory)/bin
              echo "##vso[task.prependpath]$(Agent.TempDirectory)/bin"
            displayName: 'Install Terraform'

          - script: |
              cd "$(TERRAFORM_DIR)"
              terraform fmt -check
            displayName: 'Verify Terraform code formatting'

          - script: |
              set -euo pipefail
              mkdir -p $(Agent.TempDirectory)/bin
              curl -L -s -S -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz
              tar -xzf trivy.tar.gz -C $(Agent.TempDirectory)/bin trivy
              echo "##vso[task.prependpath]$(Agent.TempDirectory)/bin"
              $(Agent.TempDirectory)/bin/trivy --version
            displayName: 'Install Trivy Scanner'

          - script: |
              echo "Scanning Kubernetes manifests..."
              trivy config --severity HIGH,CRITICAL --exit-code 1 "$(K8S_DIR)"
            displayName: 'Trivy: Audit Kubernetes Configurations'

          - script: |
              echo "Scanning Terraform configuration files..."
              trivy config --severity HIGH,CRITICAL --exit-code 1 "$(TERRAFORM_DIR)"
            displayName: 'Trivy: Audit Infrastructure Configurations'

      # ---------------------------------------------------------------------
      # Job: test_backend (Java 21 unit tests)
      # ---------------------------------------------------------------------
      - job: test_backend
        displayName: 'Backend — Gradle Tests (Java 21)'
        dependsOn: lint_and_security_scan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Cache@2
            displayName: 'Cache Gradle dependencies'
            inputs:
              key: 'gradle | "$(Agent.OS)" | ATOMIC-Backend/build.gradle | ATOMIC-Backend/gradle/wrapper/gradle-wrapper.properties'
              restoreKeys: |
                gradle | "$(Agent.OS)"
                gradle
              path: '$(HOME)/.gradle'

          - task: JavaToolInstaller@0
            displayName: 'Install Java 21'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              chmod +x ./gradlew
              ./gradlew test --no-daemon --continue
            displayName: 'Run Gradle test suite'
            workingDirectory: '$(Build.SourcesDirectory)/ATOMIC-Backend'

          - task: PublishTestResults@2
            displayName: 'Publish Backend test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/TEST-*.xml'
              searchFolder: '$(Build.SourcesDirectory)/ATOMIC-Backend/build/test-results'
              failTaskOnFailedTests: true
              testRunTitle: 'Backend Unit Tests'

      # ---------------------------------------------------------------------
      # Job: test_frontend (Node 20 component tests)
      # ---------------------------------------------------------------------
      - job: test_frontend
        displayName: 'Frontend — Vitest Tests (Node 20)'
        dependsOn: lint_and_security_scan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Cache@2
            displayName: 'Cache npm dependencies'
            inputs:
              key: 'npm | "$(Agent.OS)" | ATOMIC-Frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
                npm
              path: '$(Build.SourcesDirectory)/ATOMIC-Frontend/node_modules'

          - task: UseNode@1
            displayName: 'Install Node.js 20'
            inputs:
              version: '20.x'

          - script: |
              npm ci
            displayName: 'Install npm dependencies'
            workingDirectory: '$(Build.SourcesDirectory)/ATOMIC-Frontend'

          - script: |
              npx vitest --run --reporter=junit --outputFile=test-results/vitest-junit.xml
            displayName: 'Run Vitest test suite'
            workingDirectory: '$(Build.SourcesDirectory)/ATOMIC-Frontend'

          - task: PublishTestResults@2
            displayName: 'Publish Frontend test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/vitest-junit.xml'
              searchFolder: '$(Build.SourcesDirectory)/ATOMIC-Frontend'
              failTaskOnFailedTests: true
              testRunTitle: 'Frontend Vitest Tests'

  # =========================================================================
  # STAGE 2: Build & Package (PRs and azure)
  # Builds Docker images, scans them for vulnerabilities, and pushes to ACR.
  # Publishes configuration blueprints as Pipeline Artifacts.
  # =========================================================================
  - stage: Build
    displayName: '🐳 Stage 2 — Build & Vulnerability Scan'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      # ---------------------------------------------------------------------
      # Job: build_backend_docker
      # ---------------------------------------------------------------------
      - job: build_backend_docker
        displayName: 'Build & Scan Backend Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build Backend Docker Image'
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list \
                  --resource-group "$(TF_BACKEND_RESOURCE_GROUP)" \
                  --query "[?contains(name,'atomic')].loginServer | [0]" \
                  --output tsv 2>/dev/null || echo "")

                if [ -z "$ACR_LOGIN_SERVER" ]; then
                  echo "##[warning] ACR not yet provisioned. Building with placeholder ACR URL."
                  ACR_LOGIN_SERVER="placeholder.azurecr.io"
                fi

                echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER]$ACR_LOGIN_SERVER"

                docker build \
                  -t "$ACR_LOGIN_SERVER/backend:$(Build.SourceVersion)" \
                  -t "$ACR_LOGIN_SERVER/backend:latest" \
                  -f "$(Build.SourcesDirectory)/ATOMIC-Backend/Dockerfile" \
                  "$(Build.SourcesDirectory)/ATOMIC-Backend"

          - script: |
              set -euo pipefail
              mkdir -p $(Agent.TempDirectory)/bin
              curl -L -s -S -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz
              tar -xzf trivy.tar.gz -C $(Agent.TempDirectory)/bin trivy
              
              # Retrieve variables set in previous steps
              ACR_LOGIN_SERVER=$(az acr list --resource-group "$(TF_BACKEND_RESOURCE_GROUP)" --query "[?contains(name,'atomic')].loginServer | [0]" --output tsv 2>/dev/null || echo "placeholder.azurecr.io")
              
              echo "Scanning built Backend image..."
              $(Agent.TempDirectory)/bin/trivy image --severity HIGH,CRITICAL --exit-code 0 "$ACR_LOGIN_SERVER/backend:$(Build.SourceVersion)"
            displayName: 'Trivy: Scan Backend Image for Vulnerabilities'

          - task: AzureCLI@2
            displayName: 'Push Backend Image to ACR'
            # Only push images to ACR on commits to azure, not on PRs
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list \
                  --resource-group "$(TF_BACKEND_RESOURCE_GROUP)" \
                  --query "[?contains(name,'atomic')].loginServer | [0]" \
                  --output tsv)
                
                az acr login --name "$(echo $ACR_LOGIN_SERVER | cut -d. -f1)"
                
                docker tag "placeholder.azurecr.io/backend:$(Build.SourceVersion)" "$ACR_LOGIN_SERVER/backend:$(Build.SourceVersion)" 2>/dev/null || true
                docker tag "placeholder.azurecr.io/backend:latest" "$ACR_LOGIN_SERVER/backend:latest" 2>/dev/null || true

                docker push "$ACR_LOGIN_SERVER/backend:$(Build.SourceVersion)"
                docker push "$ACR_LOGIN_SERVER/backend:latest"
                echo "✅ Backend image successfully pushed"

      # ---------------------------------------------------------------------
      # Job: build_frontend_docker
      # ---------------------------------------------------------------------
      - job: build_frontend_docker
        displayName: 'Build & Scan Frontend Image'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build Frontend Docker Image'
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list \
                  --resource-group "$(TF_BACKEND_RESOURCE_GROUP)" \
                  --query "[?contains(name,'atomic')].loginServer | [0]" \
                  --output tsv 2>/dev/null || echo "")

                if [ -z "$ACR_LOGIN_SERVER" ]; then
                  echo "##[warning] ACR not yet provisioned. Building with placeholder ACR URL."
                  ACR_LOGIN_SERVER="placeholder.azurecr.io"
                fi

                echo "VITE_API_BASE_URL=/" > "$(Build.SourcesDirectory)/ATOMIC-Frontend/.env.production"

                docker build \
                  --build-arg VITE_API_BASE_URL=/ \
                  -t "$ACR_LOGIN_SERVER/frontend:$(Build.SourceVersion)" \
                  -t "$ACR_LOGIN_SERVER/frontend:latest" \
                  -f "$(Build.SourcesDirectory)/ATOMIC-Frontend/Dockerfile" \
                  "$(Build.SourcesDirectory)/ATOMIC-Frontend"

          - script: |
              set -euo pipefail
              mkdir -p $(Agent.TempDirectory)/bin
              curl -L -s -S -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz
              tar -xzf trivy.tar.gz -C $(Agent.TempDirectory)/bin trivy
              ACR_LOGIN_SERVER=$(az acr list --resource-group "$(TF_BACKEND_RESOURCE_GROUP)" --query "[?contains(name,'atomic')].loginServer | [0]" --output tsv 2>/dev/null || echo "placeholder.azurecr.io")
              
              echo "Scanning built Frontend image..."
              $(Agent.TempDirectory)/bin/trivy image --severity HIGH,CRITICAL --exit-code 0 "$ACR_LOGIN_SERVER/frontend:$(Build.SourceVersion)"
            displayName: 'Trivy: Scan Frontend Image for Vulnerabilities'

          - task: AzureCLI@2
            displayName: 'Push Frontend Image to ACR'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -euo pipefail
                ACR_LOGIN_SERVER=$(az acr list \
                  --resource-group "$(TF_BACKEND_RESOURCE_GROUP)" \
                  --query "[?contains(name,'atomic')].loginServer | [0]" \
                  --output tsv)

                az acr login --name "$(echo $ACR_LOGIN_SERVER | cut -d. -f1)"

                docker tag "placeholder.azurecr.io/frontend:$(Build.SourceVersion)" "$ACR_LOGIN_SERVER/frontend:$(Build.SourceVersion)" 2>/dev/null || true
                docker tag "placeholder.azurecr.io/frontend:latest" "$ACR_LOGIN_SERVER/frontend:latest" 2>/dev/null || true

                docker push "$ACR_LOGIN_SERVER/frontend:$(Build.SourceVersion)"
                docker push "$ACR_LOGIN_SERVER/frontend:latest"
                echo "✅ Frontend image successfully pushed"

      # ---------------------------------------------------------------------
      # Job: publish_deployment_assets (Publishes TF and K8s blueprints)
      # ---------------------------------------------------------------------
      - job: publish_deployment_assets
        displayName: 'Publish Deployment Blueprints'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: CopyFiles@2
            displayName: 'Collect Terraform & Kubernetes Blueprints'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                terraform/**
                k8s/**
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Blueprints Artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'deployment-assets'
              publishLocation: 'Container'

  # =========================================================================
  # STAGE 3: Infrastructure Continuous Delivery (PRs and azure)
  # Runs Terraform Plan on PRs; runs Terraform Apply on merges to azure.
  # =========================================================================
  - stage: InfraCD
    displayName: '🏗️  Stage 3 — Infrastructure CD'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: terraform_operations
        displayName: 'Terraform Plan & Apply Operations'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Blueprints Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'deployment-assets'
              downloadPath: '$(System.ArtifactsDirectory)'

          - script: |
              set -euo pipefail
              mkdir -p $(Agent.TempDirectory)/bin
              curl -L -s -S -o terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
              unzip -o -q terraform.zip -d $(Agent.TempDirectory)/bin
              echo "##vso[task.prependpath]$(Agent.TempDirectory)/bin"
            displayName: 'Install Terraform'

          - task: AzureCLI@2
            displayName: 'Terraform Init & Plan'
            env:
              ARM_USE_OIDC: true
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(AZURE_SUBSCRIPTION_ID)"
                export ARM_USE_OIDC=true

                cd "$(System.ArtifactsDirectory)/deployment-assets/terraform"

                # Initialize with remote state backend (configured in variables)
                terraform init \
                  -backend-config="resource_group_name=$(TF_BACKEND_RESOURCE_GROUP)" \
                  -backend-config="storage_account_name=$(TF_BACKEND_STORAGE_ACCOUNT)" \
                  -backend-config="container_name=$(TF_BACKEND_CONTAINER)" \
                  -backend-config="key=$(TF_BACKEND_KEY)" \
                  -reconfigure

                # Perform validation and planning
                terraform plan \
                  -out=tfplan \
                  -input=false

                terraform show -no-color tfplan > tfplan.txt
                echo "✅ Terraform Plan succeeded"

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Terraform Plan Text'
            inputs:
              targetPath: '$(System.ArtifactsDirectory)/deployment-assets/terraform/tfplan.txt'
              artifact: 'terraform-plan'
              publishLocation: 'pipeline'

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            # Only execute apply on direct pushes/merges to azure
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            env:
              ARM_USE_OIDC: true
            inputs:
              azureSubscription: '$(SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(AZURE_SUBSCRIPTION_ID)"
                export ARM_USE_OIDC=true

                cd "$(System.ArtifactsDirectory)/deployment-assets/terraform"

                # Re-apply the configured plan
                terraform apply -auto-approve -input=false tfplan
                echo "✅ Terraform Apply succeeded"

                # Extract and persist resource outputs to pipeline variables
                AKS_CLUSTER_NAME=$(terraform output -raw aks_cluster_name)
                RESOURCE_GROUP=$(terraform output -raw resource_group_name)
                ACR_LOGIN_SERVER=$(terraform output -raw acr_login_server)
                FLEXIBLE_SERVER_FQDN=$(terraform output -raw flexible_server_fqdn)
                KEY_VAULT_URI=$(terraform output -raw key_vault_uri)
                BACKEND_CLIENT_ID=$(terraform output -raw backend_identity_client_id)

                echo "##vso[task.setvariable variable=AKS_CLUSTER_NAME;isOutput=true]$AKS_CLUSTER_NAME"
                echo "##vso[task.setvariable variable=RESOURCE_GROUP;isOutput=true]$RESOURCE_GROUP"
                echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER;isOutput=true]$ACR_LOGIN_SERVER"
                echo "##vso[task.setvariable variable=FLEXIBLE_SERVER_FQDN;isOutput=true]$FLEXIBLE_SERVER_FQDN"
                echo "##vso[task.setvariable variable=KEY_VAULT_URI;isOutput=true]$KEY_VAULT_URI"
                echo "##vso[task.setvariable variable=BACKEND_CLIENT_ID;isOutput=true]$BACKEND_CLIENT_ID"

                echo "Outputs stored successfully."
            name: tf_outputs

  # =========================================================================
  # STAGE 4: Application Deployment (Azure commits only, protected Environment)
  # Uses ADO Environment gates, injects secrets, checks health, and handles rollbacks.
  # =========================================================================
  - stage: Deploy
    displayName: '🚀 Stage 4 — Application Deployment'
    dependsOn: InfraCD
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      AKS_CLUSTER_NAME: $[ stageDependencies.InfraCD.terraform_operations.outputs['tf_outputs.AKS_CLUSTER_NAME'] ]
      RESOURCE_GROUP:   $[ stageDependencies.InfraCD.terraform_operations.outputs['tf_outputs.RESOURCE_GROUP'] ]
      ACR_LOGIN_SERVER: $[ stageDependencies.InfraCD.terraform_operations.outputs['tf_outputs.ACR_LOGIN_SERVER'] ]
      FLEXIBLE_SERVER_FQDN: $[ stageDependencies.InfraCD.terraform_operations.outputs['tf_outputs.FLEXIBLE_SERVER_FQDN'] ]
      KEY_VAULT_URI:    $[ stageDependencies.InfraCD.terraform_operations.outputs['tf_outputs.KEY_VAULT_URI'] ]
      BACKEND_CLIENT_ID:  $[ stageDependencies.InfraCD.terraform_operations.outputs['tf_outputs.BACKEND_CLIENT_ID'] ]
    jobs:
      - deployment: deploy_aks
        displayName: 'Deploy to AKS & Verify Health'
        pool:
          vmImage: 'ubuntu-latest'
        # Connects deployment pipeline to the environment featuring approval locks
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'deployment-assets'
                  displayName: 'Download Blueprints Artifact'

                - task: AzureCLI@2
                  displayName: 'Connect to AKS Cluster'
                  inputs:
                    azureSubscription: '$(SERVICE_CONNECTION)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -euo pipefail
                      echo "Authenticating against AKS: $(AKS_CLUSTER_NAME)"
                      az aks get-credentials \
                        --resource-group "$(RESOURCE_GROUP)" \
                        --name "$(AKS_CLUSTER_NAME)" \
                        --overwrite-existing
                      kubectl cluster-info

                - script: |
                    set -euo pipefail
                    # Install Helm for ingress management
                    if ! command -v helm &> /dev/null; then
                      curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
                    fi

                    helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                    helm repo update

                    helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
                      --namespace "$(INGRESS_NAMESPACE)" \
                      --create-namespace \
                      --version "4.10.1" \
                      --set controller.service.annotations."service\.beta\.kubernetes\.io/azure-load-balancer-health-probe-request-path"=/healthz \
                      --set controller.admissionWebhooks.patch.nodeSelector."kubernetes\.io/os"=linux \
                      --set controller.nodeSelector."kubernetes\.io/os"=linux \
                      --set defaultBackend.nodeSelector."kubernetes\.io/os"=linux \
                      --set controller.admissionWebhooks.patch.image.registry=registry.k8s.io \
                      --wait \
                      --timeout 8m
                  displayName: 'Ensure Nginx Ingress Controller (v4.x) is Ready'

                - script: |
                    set -euo pipefail
                    kubectl apply -f "$(Pipeline.Workspace)/deployment-assets/k8s/namespace.yaml"
                  displayName: 'Ensure Production Namespace exists'

                - script: |
                    set -euo pipefail

                    # Setup env variables for envsubst manifest compilation
                    export IMAGE_TAG="$(Build.SourceVersion)"
                    export ACR_LOGIN_SERVER="$(ACR_LOGIN_SERVER)"
                    export FLEXIBLE_SERVER_FQDN="$(FLEXIBLE_SERVER_FQDN)"
                    export KEY_VAULT_URI="$(KEY_VAULT_URI)"
                    export AZURE_CLIENT_ID="$(BACKEND_CLIENT_ID)"

                    echo "Compiling and deploying Kubernetes configurations..."
                    MANIFEST_STAGE_DIR=$(mktemp -d)

                    for blueprint in $(Pipeline.Workspace)/deployment-assets/k8s/*.yaml; do
                      filename=$(basename "$blueprint")
                      # Skip namespace creation as it was already applied
                      if [ "$filename" != "namespace.yaml" ]; then
                        envsubst < "$blueprint" > "$MANIFEST_STAGE_DIR/$filename"
                      fi
                    done

                    kubectl apply -f "$MANIFEST_STAGE_DIR/"
                  displayName: 'Substitute manifest placeholders & Deploy Resources'

                - script: |
                    set -euo pipefail
                    echo "Starting rollout health checks..."
                    
                    kubectl rollout status deployment/backend --namespace production --timeout=8m &
                    BACKEND_CHECK_PID=$!

                    kubectl rollout status deployment/frontend --namespace production --timeout=8m &
                    FRONTEND_CHECK_PID=$!

                    BACKEND_RES=0
                    FRONTEND_RES=0
                    wait $BACKEND_CHECK_PID || BACKEND_RES=$?
                    wait $FRONTEND_CHECK_PID || FRONTEND_RES=$?

                    if [ $BACKEND_RES -ne 0 ] || [ $FRONTEND_RES -ne 0 ]; then
                      echo "##[error] Rollout failed! Backend code: $BACKEND_RES, Frontend code: $FRONTEND_RES"
                      exit 1
                    fi

                    echo "✅ Deployments successfully reached Ready state"
                  displayName: 'Verify Rollout Status (8m timeout)'

                - script: |
                    set -euo pipefail
                    echo "Checking Load Balancer ingress assignment..."
                    for i in $(seq 1 18); do
                      INGRESS_IP=$(kubectl get svc ingress-nginx-controller \
                        -n ingress-nginx \
                        -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                      if [ -n "$INGRESS_IP" ]; then
                        echo "============================================================="
                        echo "✅  ATOMIC Tasky is live at: http://$INGRESS_IP"
                        echo "============================================================="
                        break
                      fi
                      echo "Waiting for external load balancer allocation... ($i/18)"
                      sleep 10
                    done
                  displayName: 'Print Deployment Summary'
                  condition: succeeded()

            # ===============================================================
            # failure lifecycle hook: Executes if any deploy steps above fail.
            # Triggers automatic rollbacks to restore last stable environment.
            # ===============================================================
            on:
              failure:
                steps:
                  - task: AzureCLI@2
                    displayName: 'Trigger Automatic Rollback'
                    inputs:
                      azureSubscription: '$(SERVICE_CONNECTION)'
                      scriptType: 'bash'
                      scriptLocation: 'inlineScript'
                      inlineScript: |
                        set -euo pipefail
                        echo "⚠️ Deployment failure detected! Starting rollback sequence..."
                        
                        az aks get-credentials \
                          --resource-group "$(RESOURCE_GROUP)" \
                          --name "$(AKS_CLUSTER_NAME)" \
                          --overwrite-existing
                        
                        echo "Reverting Backend deployment to previous replica..."
                        kubectl rollout undo deployment/backend -n production
                        
                        echo "Reverting Frontend deployment to previous replica..."
                        kubectl rollout undo deployment/frontend -n production
                        
                        echo "Verifying rolled-back deployments..."
                        kubectl rollout status deployment/backend -n production --timeout=5m
                        kubectl rollout status deployment/frontend -n production --timeout=5m
                        echo "✅ Rollback successfully completed."
